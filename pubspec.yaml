name: proxi
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  internet_connection_checker_plus: ^2.9.1+2
  mask_text_input_formatter: ^2.9.0
  loading_animation_widget: ^1.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0
  flutter_local_notifications: ^21.0.0
  flutter_screen_lock: ^9.2.2+2
  flutter_native_splash: ^2.4.7
  flutter_styled_toast: ^2.3.0
  firebase_messaging: ^16.3.0
  permission_handler: ^12.0.1
  shimmer_animation: ^2.2.2+1
  local_auth_android: ^2.0.4
  shared_preferences: ^2.5.4
  device_info_plus: ^12.3.0
  local_auth_darwin: ^2.0.1
  string_validator: ^1.2.0
  flutter_timezone: ^5.0.1
  json_annotation: ^4.9.0
  table_calendar: ^3.2.0
  wakelock_plus: ^1.4.0
  firebase_core: ^4.10.0
  path_provider: ^2.1.5
  dotted_border: ^3.1.0
  flutter_bloc: ^9.1.1
  sms_autofill: ^2.4.1
  file_picker: ^10.3.7
  animations: ^2.1.1
  local_auth: ^3.0.0
  equatable: ^2.0.8
  timezone: ^0.11.0
  sqflite: ^2.4.2
  pinput: ^6.0.1
  get_it: ^9.2.0
  crypto: ^3.0.7
  uuid: ^4.5.2
  http: ^1.6.0
  formz: ^0.8.0
  intl: ^0.20.2
  path: ^1.9.1
  faker: ^2.2.0
  mime: ^2.0.0
  fpdart: ^1.2.0
  cross_file: ^0.3.5+1
  url_launcher: ^6.3.2
  go_router: ^17.0.1
  audio_waveforms: ^2.0.1
  flutter_animate: ^4.5.2
  flutter_sound: ^9.30.0
  share_plus: ^12.0.1
  camera: ^0.11.3
  camera_android: ^0.10.10+14
  video_player: ^2.10.1
  logger: ^2.6.2
  google_fonts: ^6.3.3
  dio: ^5.9.0
  envied: ^1.3.2
  ntp: ^2.0.0
  open_file: ^3.5.10
  upgrader: ^12.3.0
  firebase_crashlytics: ^5.0.5
  firebase_analytics: ^12.0.4
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.1
  image: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic

flutter_native_splash:
  # Couleur de fond
  color: "#FFFFFF"

  # Logo principal
  image: assets/logo/logo.png

  # Configuration Android
  android: true
  android_gravity: center

  # Configuration iOS
  ios: true
  ios_content_mode: center

  # Plein écran
  fullscreen: true

  # Configuration Android 12+
  android_12:
    color: "#FFFFFF"
    image: assets/logo/logo.png
    icon_background_color: "#FFFFFF"  # Ceci évite le fond noir

  # Configuration web (optionnel)
  web: false